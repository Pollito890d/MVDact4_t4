info:
  name: 6.Actualizar_Telefono
  type: http
  seq: 6

http:
  method: PUT
  url: "{{baseUrl}}/api/telefonos/1"
  body:
    type: json
    data: |-
      {
        "modelo": "iPhone 16 Pro Max",
        "precio": 28999.00,
        "almacenamientoGb": 512,
        "marcaId": 1
      }
