info:
  name: 4.Listar_Telefonos
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/telefonos?page=0&size=5"
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "5"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
